apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-service
  namespace: argocd
spec:
  project: shop
  source:
    repoURL: https://github.com/sid9743/cicd-eks-microservices.git
    targetRevision: main
    path: helm/microservice
    helm:
      valueFiles:
        - ../values/order-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
