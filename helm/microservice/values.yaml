# Defaults shared by every service. Per-service overrides live in ../values/
nameOverride: ""

replicaCount: 2

image:
  repository: ""          # set per service, e.g. <account>.dkr.ecr.ap-south-1.amazonaws.com/product-service
  tag: "latest"           # Jenkins writes the git SHA here on every release
  pullPolicy: IfNotPresent

containerPort: 8000

env: {}

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness: /healthz
  readiness: /healthz

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: alb
  host: ""
  path: /

serviceMonitor:
  enabled: true
  interval: 30s
